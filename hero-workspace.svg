<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2140"/>
      <stop offset="100%" stop-color="#0d1228"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b5cff"/>
      <stop offset="100%" stop-color="#3d7bff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#7c6bff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7c6bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <ellipse cx="340" cy="250" rx="210" ry="140" fill="url(#glow)" filter="url(#soft)"/>
  <!-- desk -->
  <path d="M80 320 L360 250 L600 330 L320 410 Z" fill="url(#desk)" stroke="#2a3358" stroke-width="2"/>
  <path d="M80 320 L80 345 L320 435 L320 410 Z" fill="#0a0e1c"/>
  <path d="M320 410 L320 435 L600 355 L600 330 Z" fill="#121833"/>
  <!-- laptop base -->
  <path d="M170 300 L390 245 L430 265 L210 325 Z" fill="#2b334f"/>
  <path d="M210 325 L430 265 L430 275 L210 335 Z" fill="#1c2338"/>
  <!-- laptop screen -->
  <path d="M185 175 L385 125 L405 235 L205 290 Z" fill="#151b2e" stroke="#3a4568" stroke-width="3"/>
  <path d="M198 188 L372 142 L388 228 L214 276 Z" fill="url(#screen)"/>
  <!-- UI on screen -->
  <rect x="230" y="175" width="55" height="90" rx="8" transform="skewY(-12)" fill="#fff" opacity=".92"/>
  <rect x="300" y="168" width="55" height="90" rx="8" transform="skewY(-12)" fill="#0f172a" opacity=".85"/>
  <circle cx="258" cy="195" r="10" fill="#6b5cff"/>
  <rect x="245" y="215" width="40" height="5" rx="2" fill="#c7d2fe"/>
  <rect x="245" y="228" width="32" height="5" rx="2" fill="#a5b4fc"/>
  <rect x="315" y="205" width="38" height="5" rx="2" fill="#94a3b8"/>
  <rect x="315" y="218" width="28" height="5" rx="2" fill="#64748b"/>
  <!-- tablet -->
  <path d="M360 285 L470 255 L490 325 L380 358 Z" fill="#1e2438" stroke="#4b5678" stroke-width="2"/>
  <path d="M372 295 L460 270 L474 318 L386 345 Z" fill="#334155"/>
  <rect x="390" y="300" width="50" height="8" rx="2" transform="skewY(-8)" fill="#60a5fa" opacity=".8"/>
  <rect x="390" y="315" width="38" height="6" rx="2" transform="skewY(-8)" fill="#94a3b8" opacity=".7"/>
  <!-- stylus -->
  <path d="M455 270 L505 220" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="508" cy="217" r="5" fill="#f8fafc"/>
  <!-- coffee -->
  <ellipse cx="300" cy="355" rx="28" ry="10" fill="#1a2035"/>
  <path d="M278 330 C278 318 322 318 322 330 L318 355 C318 362 282 362 282 355 Z" fill="#e2e8f0"/>
  <path d="M286 328 C290 318 310 318 314 328" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <ellipse cx="300" cy="330" rx="18" ry="6" fill="#78350f"/>
  <!-- floating cards -->
  <rect x="470" y="140" width="70" height="50" rx="8" fill="#fff" opacity=".12" stroke="#8b9cff" stroke-width="1"/>
  <rect x="485" y="155" width="40" height="6" rx="2" fill="#a5b4fc"/>
  <rect x="485" y="168" width="28" height="6" rx="2" fill="#64748b"/>
  <circle cx="130" cy="210" r="28" fill="#5b4dff" opacity=".35"/>
  <rect x="95" y="250" width="48" height="36" rx="6" fill="#fff" opacity=".1" stroke="#7c8cff"/>
</svg>
